[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "ishmem4py"
version = "0.1.0a0"
description = "Python bindings for Intel SHMEM"
readme = "README.md"
requires-python = ">=3.10"
authors = [
  { name = "Intel SHMEM contributors" }
]
license = { text = "BSD-3-Clause" }
classifiers = [
  "Development Status :: 3 - Alpha",
  "License :: OSI Approved :: BSD License",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3 :: Only",
]

[tool.setuptools]
include-package-data = false

[tool.setuptools.packages.find]
where = ["."]
include = ["ishmem4py"]

[tool.setuptools.package-data]
ishmem4py = [
  "_ishmem4py_runtime*.so",
  "_ishmem4py_runtime*.dylib",
  "_ishmem4py_runtime*.pyd",
  "_ishmem4py_torch*.so",
  "_ishmem4py_torch*.dylib",
  "_ishmem4py_torch*.pyd",
]
